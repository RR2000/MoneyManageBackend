name: CI

# PR and main: tests on a real (embedded) PostgreSQL.
# main: image on GitHub Container Registry, :sha-<commit> and :main, under two names during the rename:
# ghcr.io/rr2000/money-manage-backend (new, like the repo) and ghcr.io/rr2000/moneymanage-backend (old).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rr2000/moneymanage-backend:${{ steps.tag.outputs.tag }}
            ghcr.io/rr2000/moneymanage-backend:main
            ghcr.io/rr2000/money-manage-backend:${{ steps.tag.outputs.tag }}
            ghcr.io/rr2000/money-manage-backend:main
          labels: |
            org.opencontainers.image.source=https://github.com/RR2000/money-manage-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

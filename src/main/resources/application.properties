spring.application.name=MoneyManage

# PostgreSQL, everything from the environment. Shared schema "public" (users) migrated by Flyway from
# db/public; every user has a schema u<id> migrated from db/tenant (see TenantSchemas): the app's database
# user must be allowed to create schemas in its database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/money}
spring.datasource.username=${DB_USER:money}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/public
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# behind the reverse proxy
server.forward-headers-strategy=framework
# error messages (bad file, username taken...) reach the web app
spring.web.error.include-message=always

# CORS only for the Angular dev server; in production the web app and the API share the origin
app.cors.allowed-origins=${MONEY_CORS_ORIGINS:http://localhost:4200}

# JWT: app.jwt.secret (>= 32 characters) from the environment; unset = random key at every start
app.jwt.secret=${MONEY_JWT_SECRET:}
app.jwt.expiration=86400000

# optional "Accedi con GitHub": a GitHub OAuth App with callback <site>/api/login/oauth2/code/github; empty = off
app.github.client-id=${GITHUB_CLIENT_ID:}
app.github.client-secret=${GITHUB_CLIENT_SECRET:}

management.endpoints.web.exposure.include=health
logging.level.root=warn
logging.level.com.rondinella=info

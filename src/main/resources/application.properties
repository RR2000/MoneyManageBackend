spring.application.name=money-manage-backend

# PostgreSQL, everything from the environment. Shared schema "public" (users) migrated by Flyway from
# db/public; every user has a schema u<id> migrated from db/tenant (see TenantSchemas): the app's database
# user must be allowed to create schemas in its database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/money}
spring.datasource.username=${DB_USER:money}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/public
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# behind the reverse proxy
server.forward-headers-strategy=framework
# error messages (bad file, username taken...) reach the web app; unexpected errors get a generic message
# (ApiExceptionHandler), never a stack trace
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
# bank exports: one file up to 10 MB (nginx in front accepts 20 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# the session only lives for the "Accedi con GitHub" round trip
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=10m

# CORS closed: the web app and the API share the origin (also locally, through the Angular dev server proxy)
app.cors.allowed-origins=${MONEY_CORS_ORIGINS:}

# JWT: app.jwt.secret (>= 32 random characters) from the environment; unset = random key at every start
app.jwt.secret=${MONEY_JWT_SECRET:}
app.jwt.expiration=86400000

# brakes on password guessing and mass registration (LoginThrottle)
app.auth.max-failures=5
app.auth.max-registrations=30
app.auth.window-minutes=15

# prices of the investments: Alpha Vantage (free key, 25 requests a day, one a second) first, then Yahoo; empty key = Yahoo
# and CSV import only. OpenFIGI (no key) turns an ISIN into tickers, kept for good.
app.prices.alphavantage-key=${MONEY_PRICES_API_KEY:}
app.prices.daily-limit=25

# optional "Accedi con GitHub": a GitHub OAuth App with callback <site>/api/login/oauth2/code/github; empty = off
app.github.client-id=${GITHUB_CLIENT_ID:}
app.github.client-secret=${GITHUB_CLIENT_SECRET:}

# which logins (AuthMode): legacy (password and GitHub), both (plus the site's single sign-on), oidc (only that one;
# password login, sign-up and reset answer 404). Back to legacy or both at any time, accounts do not change.
app.auth.mode=${AUTH_MODE:legacy}
# the site's single sign-on (OpenID Connect, Zitadel): issuer (https://auth...) and client id of a public client with
# PKCE, redirect URI <site>/api/login/oauth2/code/zitadel, post-logout redirect URI <app.web-url>/. Empty = off.
app.oidc.issuer=${MONEY_OIDC_ISSUER:}
app.oidc.client-id=${MONEY_OIDC_CLIENT_ID:}

# optional "forgot password" by email, through an SMTP relay with STARTTLS (EmailLinks); any of host, username,
# password, sender or web URL empty = off. Links in the emails point to app.web-url (never to the request's Host).
app.web-url=${MONEY_WEB_URL:}
app.mail.host=${SMTP_HOST:}
app.mail.port=${SMTP_PORT:587}
app.mail.username=${SMTP_USERNAME:}
app.mail.password=${SMTP_PASSWORD:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=Money Manage
# requests that send a mail, per hour: per client address (then 429), per email and for the whole site (then
# nothing is sent, same answer)
app.mail.limit.per-ip=10
app.mail.limit.per-email=3
app.mail.limit.total=50
app.mail.limit.window-minutes=60
# no mail health check: a slow relay must not make the site look down
management.health.mail.enabled=false

# only the health check, without details; /actuator is not reachable from outside (nginx passes only /api)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# API description off unless asked for (MONEY_API_DOCS=true, for a local run)
springdoc.api-docs.enabled=${MONEY_API_DOCS:false}
springdoc.swagger-ui.enabled=${MONEY_API_DOCS:false}

logging.level.root=warn
logging.level.com.rondinella=info
# a failed SQL statement is logged by Hibernate with its values (amounts, descriptions): not in the logs
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=off

# optional open banking through Enable Banking (restricted mode: only the owner's own accounts). Off unless the
# application id, its RSA private key (the PEM file in base64 on one line) and the enabled user ids (comma separated)
# are set, and app.web-url too: the bank sends the browser back to <web-url>/api/banking/callback, which must be among
# the redirect URLs of the application. For the other users every /api/banking endpoint answers 404.
# Syncs twice a day (app.banking.cron, Europe/Rome) and when the user asks.
app.banking.app-id=${MONEY_ENABLEBANKING_APP_ID:}
app.banking.private-key-b64=${MONEY_ENABLEBANKING_KEY:}
app.banking.users=${MONEY_BANKING_USERS:}
app.banking.api-url=https://api.enablebanking.com
app.banking.cron=0 30 6,18 * * *
app.banking.zone=Europe/Rome
